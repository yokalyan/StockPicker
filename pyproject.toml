[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockpicker"
version = "0.1.0"
description = "Filings intelligence engine for 13F/13D/13G-driven equity research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "rich>=13.7",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
stockpicker = "stockpicker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stockpicker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
